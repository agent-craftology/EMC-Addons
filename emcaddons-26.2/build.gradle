plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"emcaddons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// splitEnvironmentSourceSets() puts GUI in `client`. Loom's jar up-to-date
// checks often miss those outputs, so `gradlew build` can leave build/libs stale.
def emcJarName = "EMC Addons ${project.mod_version}-${project.minecraft_version}.jar"
afterEvaluate {
	def clientOut = sourceSets.client.output
	tasks.named("jar").configure {
		inputs.files(clientOut)
		archiveFileName.set(emcJarName)
	}
	sourceSets.test.compileClasspath += clientOut
	sourceSets.test.runtimeClasspath += clientOut
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

tasks.named("compileTestJava").configure {
	dependsOn("compileClientJava")
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
